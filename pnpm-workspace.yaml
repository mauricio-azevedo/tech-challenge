packages:
  - apps/*
  - packages/*

# Versoes compartilhadas entre os pacotes do workspace (referenciadas como "catalog:").
# Mantemos o minimumReleaseAge padrao do pnpm (1 dia): versoes mais novas que isso nao entram.
catalog:
  '@types/node': ^22.18.0
  typescript: ~6.0.3
  vitest: ^4.1.11
  '@vitest/coverage-v8': ^4.1.11
  vite-tsconfig-paths: ^6.1.1
  zod: ^4.5.0
  tsx: ~4.23.12

# pnpm bloqueia scripts de instalacao de dependencias por padrao; entradas em allowBuilds liberam
# apenas o que precisa compilar ou baixar binarios (pnpm approve-builds).
allowBuilds:
  # baixa o schema engine usado por `prisma migrate`
  '@prisma/engines': true
  prisma: true
  # resolvedor nativo usado pelo eslint-config-next
  unrs-resolver: true
  # o postinstall do msw so imprime uma mensagem
  msw: false
  # binario nativo usado pelo tsx (scripts/smoke.ts)
  esbuild: true
