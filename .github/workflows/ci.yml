name: CI

# Roda o mesmo quality gate que o desenvolvedor roda na maquina (pnpm quality), a cada push e a cada PR.
on:
  push:
  pull_request:

# Um push novo na mesma branch cancela a execucao anterior, que ja nao interessa.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Hooks de git nao fazem sentido no CI.
      HUSKY: 0
    services:
      # Mesma imagem do docker-compose.yml: os testes de integracao rodam contra um Postgres real.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: challenge
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Exatamente o passo que o README pede, na mesma ordem: o .env precisa existir antes do
      # pnpm install, porque o `prepare` gera o client Prisma e le a configuracao do banco.
      - run: cp .env.example .env

      - uses: pnpm/setup@v2
        with:
          # A versao vem do campo packageManager do package.json.
          cache: true
          # O install e um passo explicito logo abaixo, com o lockfile congelado.
          install: false

      - run: pnpm install --frozen-lockfile

      - run: pnpm quality
