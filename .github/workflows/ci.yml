name: CI

# Roda o mesmo quality gate que o desenvolvedor roda na maquina (pnpm quality), a cada push e a cada PR.
on:
  push:
  pull_request:

# Um push novo na mesma branch cancela a execucao anterior, que ja nao interessa.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Hooks de git nao fazem sentido no CI.
      HUSKY: 0
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - uses: pnpm/setup@v2
        with:
          # A versao vem do campo packageManager do package.json.
          cache: true

      # Exatamente o passo que o README pede: o CI usa o mesmo .env que o ambiente local.
      - run: cp .env.example .env

      - run: pnpm install --frozen-lockfile

      - run: pnpm quality
